name: Users Feedbacks
on:
  repository_dispatch:
    types: [feedback]
  workflow_dispatch:
       inputs:
         titre:
           required: true
         description:
           required: true

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    outputs:
      issue_node_id: ${{ steps.creation.outputs.node_id }}
    steps:
      - id: creation
        uses: actions/github-script@v7
        with:
          script: |
            const { titre, description, os, version } = context.payload.client_payload;
            const { data } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Beta] ${titre}`,
              body: `${description}\n\n---\n${os ? `OS: ${os}\n` : ''}${version ? `Version: ${version}` : ''}`,
              labels: ['beta-feedback'],
            });
            core.setOutput('node_id', data.node_id);

  add-issue-to-project:
    needs: create-issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FEEDBACK_ACCESS_TOKEN }}
          script: |
            await github.graphql(`
              mutation($project: ID!, $issue: ID!) {
                addProjectV2ItemById(input: { projectId: $project, contentId: $issue }) {
                  item { id }
                }
              }
            `, {
              project: ${{ secrets.PROJECT_ID_USER_FEEDBACK }},
              issue: ${{ needs.create-issue.outputs.issue_node_id }},
            });